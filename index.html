</main>

// ---------- 轨迹清洗与等弧长重采样（不把首尾强行连接） ----------
function cleanPoints(points,gap){
 const out=[];
 for(const p of points){
  if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.t)) continue;
  if(!out.length||distance(p,out[out.length-1])>=gap) out.push({...p});
 }
 const last=points[points.length-1];
 if(last&&out.length&&Number.isFinite(last.x)&&Number.isFinite(last.y)&&Number.isFinite(last.t)&&distance(last,out[out.length-1])>SCORE_CONFIG.epsilon) out.push({...last});
 return out;
}
function pathLength(points){let length=0;for(let i=1;i<points.length;i++) length+=distance(points[i-1],points[i]);return length;}
function resampleByArcLength(points,count){
 const cumulative=[0];
 for(let i=1;i<points.length;i++) cumulative.push(cumulative[i-1]+distance(points[i-1],points[i]));
 const total=cumulative[cumulative.length-1];
 if(!(total>0)) return [];
 const out=[];let j=1;
 for(let i=0;i<count;i++){
  const target=total*i/(count-1);
  while(j<cumulative.length-1&&cumulative[j]<target) j++;
  const a=points[j-1],b=points[j],span=cumulative[j]-cumulative[j-1];
  const u=span>0?clamp((target-cumulative[j-1])/span):0;
  out.push({x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,t:a.t+(b.t-a.t)*u});
 }
 return out;
}
// 带部分主元的 3×3 高斯消元；奇异矩阵直接拒绝。
function solve3(matrix,vector){
 const a=matrix.map((row,i)=>[...row,vector[i]]);
 for(let col=0;col<3;col++){
  let pivot=col;for(let i=col+1;i<3;i++) if(Math.abs(a[i][col])>Math.abs(a[pivot][col])) pivot=i;
  if(Math.abs(a[pivot][col])<SCORE_CONFIG.epsilon) return null;
  [a[col],a[pivot]]=[a[pivot],a[col]];
  const divisor=a[col][col];for(let j=col;j<4;j++) a[col][j]/=divisor;
  for(let i=0;i<3;i++) if(i!==col){const factor=a[i][col];for(let j=col;j<4;j++) a[i][j]-=factor*a[col][j];}
 }
 return a.map(row=>row[3]);
}
function covarianceAxisRatio(points){
 const n=points.length,mx=points.reduce((s,p)=>s+p.x,0)/n,my=points.reduce((s,p)=>s+p.y,0)/n;
 let xx=0,yy=0,xy=0;
 for(const p of points){const x=p.x-mx,y=p.y-my;xx+=x*x;yy+=y*y;xy+=x*y;}
 const trace=xx+yy,delta=Math.hypot(xx-yy,2*xy);
 return (trace-delta)/Math.max(trace+delta,SCORE_CONFIG.epsilon);
}
function fitCircle(points){
 // 先平移到质心并按 RMS 尺度归一化，避免大坐标正规方程病态。
 const n=points.length,mx=points.reduce((s,p)=>s+p.x,0)/n,my=points.reduce((s,p)=>s+p.y,0)/n;
 const scale=Math.sqrt(points.reduce((s,p)=>s+(p.x-mx)**2+(p.y-my)**2,0)/n);
 if(!(scale>SCORE_CONFIG.epsilon)) return null;
 const q=points.map(p=>({x:(p.x-mx)/scale,y:(p.y-my)/scale}));
 const matrix=[[0,0,0],[0,0,0],[0,0,0]],vector=[0,0,0];
 for(const p of q){const row=[p.x,p.y,1],z=-(p.x*p.x+p.y*p.y);for(let i=0;i<3;i++){vector[i]+=row[i]*z;for(let j=0;j<3;j++) matrix[i][j]+=row[i]*row[j];}}
 const solution=solve3(matrix,vector);if(!solution) return null;
 let cx=-solution[0]/2,cy=-solution[1]/2,r2=cx*cx+cy*cy-solution[2];
 if(!(r2>0)) return null;let r=Math.sqrt(r2);
 // 代数解之后做少量几何最小二乘迭代，直接减小径向残差。
 for(let iteration=0;iteration<5;iteration++){
  const h=[[0,0,0],[0,0,0],[0,0,0]],g=[0,0,0];let oldLoss=0;
  for(const p of q){const d=Math.hypot(cx-p.x,cy-p.y);if(d<SCORE_CONFIG.epsilon) continue;const e=d-r,jac=[(cx-p.x)/d,(cy-p.y)/d,-1];oldLoss+=e*e;for(let i=0;i<3;i++){g[i]-=jac[i]*e;for(let j=0;j<3;j++) h[i][j]+=jac[i]*jac[j];}}
  const step=solve3(h,g);if(!step) break;
  const nx=cx+step[0],ny=cy+step[1],nr=r+step[2];
  const loss=q.reduce((s,p)=>s+(Math.hypot(p.x-nx,p.y-ny)-nr)**2,0);
  if(!(nr>0)||!Number.isFinite(loss)||loss>oldLoss) break;
  cx=nx;cy=ny;r=nr;
 }
 return {cx:mx+cx*scale,cy:my+cy*scale,r:r*scale};
}
function computeMetrics(points,circle){
 const {cx,cy,r}=circle,n=points.length;
 let squared=0,area2=0;const angles=[];
 for(let i=0;i<n;i++){
  const p=points[i],next=points[(i+1)%n];
  squared+=(Math.hypot(p.x-cx,p.y-cy)-r)**2;
  area2+=(p.x-cx)*(next.y-cy)-(next.x-cx)*(p.y-cy);
  angles.push(Math.atan2(p.y-cy,p.x-cx));
 }
 const bins=new Uint8Array(SCORE_CONFIG.angleBins),deltas=[];
 const mark=a=>{bins[Math.floor((((a%TAU)+TAU)%TAU)/TAU*bins.length)%bins.length]=1;};
 let net=0,travel=0,positive=0,negative=0;
 mark(angles[0]);
 for(let i=1;i<n;i++){
  const delta=Math.atan2(Math.sin(angles[i]-angles[i-1]),Math.cos(angles[i]-angles[i-1]));
  deltas.push(delta);net+=delta;travel+=Math.abs(delta);
  if(delta>=0) positive+=delta;else negative-=delta;
  // 标记真实相邻线段扫过的角度，不填补首尾缺口。
  const steps=Math.max(1,Math.ceil(Math.abs(delta)/TAU*bins.length*2));
  for(let k=1;k<=steps;k++) mark(angles[i-1]+delta*k/steps);
 }
 const sign=net>=0?1:-1;let reverseRun=0,reverseRuns=0;
 for(const delta of [...deltas,sign]){
  if(delta*sign<0) reverseRun+=Math.abs(delta);
  else{if(reverseRun>=SCORE_CONFIG.reverseRunAngle) reverseRuns++;reverseRun=0;}
 }
 const length=pathLength(points),closure=distance(points[0],points[n-1]),perimeter=length+closure;
 const reverseFraction=Math.min(positive,negative)/Math.max(travel,SCORE_CONFIG.epsilon);
 return {
  radialError:Math.sqrt(squared/n)/r,closureError:closure/(2*r),
  coverage:bins.reduce((a,b)=>a+b,0)/bins.length,lengthRatio:length/(TAU*r),
  directionConsistency:Math.abs(net)/Math.max(travel,SCORE_CONFIG.epsilon),
  circularity:clamp(4*Math.PI*Math.abs(area2/2)/(perimeter*perimeter)),
  netTurns:Math.abs(net)/TAU,travelTurns:travel/TAU,reverseFraction,reverseRuns

}
function invalidReason(points,circle,metrics,width,height){
 const c=SCORE_CONFIG,short=Math.min(width,height);
 if(!circle||!Object.values(circle).every(Number.isFinite)||!metrics||!Object.values(metrics).every(Number.isFinite)) return 'invalidFit';
 if(circle.r<short*c.minRadiusRatio) return 'smallMoon';
 if(circle.r>Math.hypot(width,height)*c.maxRadiusRatio) return 'fullMoon';
 if(metrics.netTurns>c.maxNetTurns||metrics.travelTurns>c.maxTravelTurns) return 'tooMany';
 if(metrics.coverage<c.minCoverage) return 'notClosed';
 if(metrics.reverseFraction>c.maxReverseFraction||metrics.reverseRuns>c.maxReverseRuns||metrics.lengthRatio>c.maxLengthRatio) return 'messy';
 return '';
}
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
function metricsToScore(m){
 const c=SCORE_CONFIG;
 // 平滑平方指数：零点处斜率为 0，容忍轻微误差，大误差快速降分。
 const quality=(error,scale)=>Math.exp(-((error/scale)**2));
 const scores={
  radialScore:100*quality(m.radialError,c.radialScale),
  closureScore:100*quality(m.closureError,c.closureScale),
  coverageScore:100*smoothstep(c.coverageStart,c.coverageFull,m.coverage),
  lengthScore:100*quality(Math.abs(m.lengthRatio-1),c.lengthScale),
  directionScore:100*quality(1-m.directionConsistency,c.directionScale),
  shapeScore:100*quality(1-m.circularity,c.shapeScale)
 };
 const weighted=scores.radialScore*c.radialWeight+scores.closureScore*c.closureWeight+scores.coverageScore*c.coverageWeight+scores.lengthScore*c.lengthWeight+scores.directionScore*c.directionWeight+scores.shapeScore*c.shapeWeight;
 const weightSum=c.radialWeight+c.closureWeight+c.coverageWeight+c.lengthWeight+c.directionWeight+c.shapeWeight;
 // 完整性门控避免“很圆的开口弧”或明显椭圆被其余满分项托高。
 const gate=quality(m.closureError,c.closureGateScale)*smoothstep(c.coverageGateStart,c.coverageFull,m.coverage)*quality(m.radialError,c.radialGateScale)*quality(Math.abs(m.lengthRatio-1),c.lengthGateScale);
 return {subscores:scores,score:Math.round(clamp(weighted/weightSum*gate,0,100)*10)/10};
}
function analyzeTrajectory(raw,width,height){
 const c=SCORE_CONFIG,short=Math.min(width,height),fail=reasonKey=>({valid:false,reasonKey});
 if(!(short>0)||raw.some(p=>![p.x,p.y,p.t].every(Number.isFinite))) return fail('badData');
 const clean=cleanPoints(raw,short*c.cleanGapRatio);
 if(clean.length<c.minPoints) return fail('slowComplete');
 const unique=new Set(clean.map(p=>`${Math.round(p.x/(short*c.cleanGapRatio))},${Math.round(p.y/(short*c.cleanGapRatio))}`));
 if(unique.size<c.minUniquePoints||pathLength(clean)<short*c.minLengthRatio) return fail('tooShort');

}

// ---------- Canvas 尺寸、输入和生命周期 ----------
function scheduleDraw(){state.dirty=true;if(!state.frame) state.frame=requestAnimationFrame(renderFrame);}
function resizeCanvas(){
 if(!$('modal').hidden){state.pendingResize=true;return;}
 const rect=canvas.getBoundingClientRect(),width=rect.width,height=rect.height,dpr=window.devicePixelRatio||1;
 if(width<=0||height<=0) return;
 if(Math.abs(width-state.width)<.1&&Math.abs(height-state.height)<.1&&dpr===state.dpr) return;
 const hadDrawing=state.active!==null||state.points.length>0;
 resetGame(hadDrawing?'resize':'ready');
 state.width=width;state.height=height;state.dpr=dpr;
 // 每次根据 CSS 逻辑尺寸重新赋值，不在原 backing store 上累乘 DPR。
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
 scheduleDraw();
}
function releasePointer(){
 const id=state.active;state.active=null;
 try{if(typeof id==='number'&&canvas.hasPointerCapture&&canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);}catch(_error){}
}
function resetGame(messageKey='ready'){
 releasePointer();state.points=[];state.result=null;state.duration=0;state.submitted=false;state.uiState='ready';state.cancelKey=null;
 $('score').textContent='—';$('timer').textContent=t('time',{seconds:'0.0'});
 $('verdict').textContent=t(messageKey);$('poem').textContent=t('scoreHint');
 $('hint').hidden=false;$('submit').disabled=true;$('submit').textContent=t('submit');
 $('stageNote').textContent=t('stageReady');$('ripple').classList.remove('play');scheduleDraw();
}
function cancelDrawing(messageKey){
 if(state.active===null) return;
 state.duration=performance.now()-state.start;releasePointer();state.result=null;state.uiState='cancelled';state.cancelKey=messageKey;
 $('verdict').textContent=t(messageKey);$('poem').textContent=t('cancelHint');
 $('submit').disabled=true;$('stageNote').textContent=t('stageInterrupted');scheduleDraw();
}
function logicalPoint(event){
 const rect=canvas.getBoundingClientRect();
 return {x:(event.clientX-rect.left)*state.width/rect.width,y:(event.clientY-rect.top)*state.height/rect.height,t:Math.max(0,performance.now()-state.start)};
}
function inside(p){return p.x>=0&&p.y>=0&&p.x<=state.width&&p.y<=state.height;}
function appendPoint(event,force=false){
 const p=logicalPoint(event);
 if(!inside(p)){cancelDrawing('boundary');return false;}
 const last=state.points[state.points.length-1];
 if(!last||distance(last,p)>=Math.min(state.width,state.height)*SCORE_CONFIG.sampleGapRatio||(force&&distance(last,p)>SCORE_CONFIG.epsilon)) state.points.push(p);
 if(state.points.length>SCORE_CONFIG.maxPoints){cancelDrawing('tooLong');return false;}
 scheduleDraw();return true;
}
function startStroke(event){
 if(!$('modal').hidden||state.submitting||state.inputBlocked||!state.width) return;
 if(event.button!==undefined&&event.button!==0) return;
 if(state.active!==null){cancelDrawing('multi');return;}
 if(event.isPrimary===false) return;
 if(event.cancelable) event.preventDefault();
 resetGame();state.start=performance.now();state.active=event.pointerId;state.uiState='drawing';
 $('hint').hidden=true;$('verdict').textContent=t('drawing');
 $('stageNote').textContent=t('stageDrawing');
 try{if(typeof event.pointerId==='number'&&canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);}catch(_error){}
 appendPoint(event,true);
}
function moveStroke(event){
 if(event.pointerId!==state.active) return;
 if(event.cancelable) event.preventDefault();
 const samples=event.getCoalescedEvents?event.getCoalescedEvents():[];
 for(const sample of samples) if(!appendPoint(sample)) return;
 // 个别浏览器返回空 coalesced 列表，仍记录主事件。
 appendPoint(event);
}
function finishStroke(event){
 if(event.pointerId!==state.active) return;
 if(event.cancelable) event.preventDefault();
 if(!appendPoint(event,true)||state.active===null) return;
 state.duration=performance.now()-state.start;releasePointer();
 const result=analyzeTrajectory(state.points,state.width,state.height);
 state.result={...result,width:state.width,height:state.height,durationMs:Math.round(state.duration),createdAt:new Date().toISOString()};
 state.uiState='result';
 if(SCORE_CONFIG.debug){console.group('画月评分');console.log('拟合圆',result.circle);console.table(result.metrics||{});console.table(result.subscores||{});console.log('最终分数',result.score,'有效',result.valid,result.reasonKey?t(result.reasonKey):'');console.groupEnd();}

}
function bindInputEvents(){
 if(window.PointerEvent){
  const heldPointers=new Set();
  document.addEventListener('pointerdown',event=>{
   heldPointers.add(event.pointerId);
   if(heldPointers.size>1){state.inputBlocked=true;if(state.active!==null){if(event.cancelable) event.preventDefault();cancelDrawing('multi');}}
  },{capture:true,passive:false});
  const releaseHeld=event=>{heldPointers.delete(event.pointerId);if(!heldPointers.size) state.inputBlocked=false;};
  window.addEventListener('pointerup',releaseHeld,true);
  window.addEventListener('pointercancel',releaseHeld,true);
  window.addEventListener('blur',()=>{heldPointers.clear();state.inputBlocked=false;});
  canvas.addEventListener('pointerdown',startStroke);
  window.addEventListener('pointermove',moveStroke,{passive:false});
  window.addEventListener('pointerup',finishStroke,{passive:false});
  window.addEventListener('pointercancel',event=>{if(event.pointerId===state.active) cancelDrawing('pointerCancel');});
  canvas.addEventListener('lostpointercapture',event=>{if(event.pointerId===state.active) cancelDrawing('captureLost');});
 }else{
  // 老浏览器 Touch Events 回退：不同时注册另一套 Pointer 采样。
  const wrap=(event,touch)=>({clientX:touch.clientX,clientY:touch.clientY,pointerId:`touch-${touch.identifier}`,cancelable:event.cancelable,preventDefault:()=>event.preventDefault()});
  document.addEventListener('touchstart',event=>{if(event.touches.length>1&&state.active!==null){event.preventDefault();cancelDrawing('multi');}},{capture:true,passive:false});
  canvas.addEventListener('touchstart',event=>{if(event.touches.length===1) startStroke(wrap(event,event.changedTouches[0]));},{passive:false});
  window.addEventListener('touchmove',event=>{for(const touch of event.changedTouches) moveStroke(wrap(event,touch));},{passive:false});
  window.addEventListener('touchend',event=>{for(const touch of event.changedTouches) finishStroke(wrap(event,touch));},{passive:false});
  window.addEventListener('touchcancel',()=>cancelDrawing('pointerCancel'));
  if(!('ontouchstart' in window)){
   const mouse=event=>({clientX:event.clientX,clientY:event.clientY,button:event.button,pointerId:'mouse',cancelable:event.cancelable,preventDefault:()=>event.preventDefault()});
   canvas.addEventListener('mousedown',event=>startStroke(mouse(event)));
   window.addEventListener('mousemove',event=>moveStroke(mouse(event)));
   window.addEventListener('mouseup',event=>finishStroke(mouse(event)));
  }
 }
 canvas.addEventListener('contextmenu',event=>event.preventDefault());
 // 补足旧版移动浏览器 touch-action/overscroll 行为。
 $('stage').addEventListener('touchmove',event=>event.preventDefault(),{passive:false});
 window.addEventListener('blur',()=>cancelDrawing('blur'));
 document.addEventListener('visibilitychange',()=>{if(document.hidden) cancelDrawing('hidden');});
}

// ---------- 平滑绘制，仅影响显示；评分仍使用轨迹坐标 ----------
function drawCanvas(){
 ctx.clearRect(0,0,state.width,state.height);
 const circle=state.result?.valid?state.result.circle:null;
 if(circle){ctx.save();ctx.strokeStyle='rgba(183,207,237,.30)';ctx.lineWidth=1;ctx.setLineDash([4,7]);ctx.beginPath();ctx.arc(circle.cx,circle.cy,circle.r,0,TAU);ctx.stroke();ctx.restore();}
 const points=state.points;if(!points.length) return;
 ctx.save();ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);
 for(let i=1;i<points.length-1;i++){const p=points[i],next=points[i+1];ctx.quadraticCurveTo(p.x,p.y,(p.x+next.x)/2,(p.y+next.y)/2);}
 const last=points[points.length-1];ctx.lineTo(last.x,last.y);
 ctx.lineCap='round';ctx.lineJoin='round';
 // 两层线条模拟月光，避免每帧昂贵的大面积 shadowBlur。
 ctx.strokeStyle='rgba(245,207,143,.13)';ctx.lineWidth=10;ctx.stroke();
 ctx.strokeStyle='#ffe8b9';ctx.lineWidth=2.6;ctx.stroke();ctx.restore();
}
function renderFrame(){
 state.frame=0;
 if(state.active!==null){state.duration=performance.now()-state.start;if(state.duration>SCORE_CONFIG.maxDurationMs) cancelDrawing('timeout');}
 $('timer').textContent=t('time',{seconds:(state.duration/1000).toFixed(1)});
 if(state.dirty){state.dirty=false;drawCanvas();}
 if(state.active!==null&&!state.frame) state.frame=requestAnimationFrame(renderFrame);
}
function chineseScore(score){
 const digits='零一二三四五六七八九',rounded=Math.round(clamp(score,0,100));
 if(rounded===100) return '十成';
 return `${digits[Math.floor(rounded/10)]}成${digits[rounded%10]}分`;
}
function evaluation(score){
 if(score>=95) return t('eval95');
 if(score>=90) return t('eval90');
 if(score>=80) return t('eval80');
 if(score>=70) return t('eval70');
 if(score>=60) return t('eval60');
 return t('eval0');
}
function updateResultUI(){
 const result=state.result;
 $('score').textContent=result.valid?result.score.toFixed(1):'—';
 $('verdict').textContent=result.valid?evaluation(result.score):t(result.reasonKey);
 const expression=currentLanguage==='en'?result.score.toFixed(1):chineseScore(result.score);
 $('poem').textContent=result.valid?t('similarity',{score:expression}):t('invalidHint');
 $('submit').disabled=!result.valid;
 $('stageNote').textContent=result.valid?t('fitNote'):t('tryAgain');
 if(result.valid&&!reducedMotion.matches){
  const ripple=$('ripple'),{cx,cy,r}=result.circle;
  ripple.style.setProperty('--x',`${cx}px`);ripple.style.setProperty('--y',`${cy}px`);ripple.style.setProperty('--diameter',`${r*2}px`);
  ripple.classList.remove('play');void ripple.offsetWidth;ripple.classList.add('play');
 }
}

function cleanNickname(value){return value.normalize('NFC').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim();}
function nicknameLength(value){return Array.from(value).reduce((n,ch)=>n+(ch.codePointAt(0)<=0x7f?1:2),0);}
function escapeHTML(value){return value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function openModal(){
 if(!state.result?.valid||state.submitting||state.submitted) return;
 $('modal').hidden=false;$('app').inert=true;$('nicknameError').textContent='';$('nickname').focus();
}
function closeModal(){
 if(state.submitting) return;
 $('modal').hidden=true;$('app').inert=false;
 if(state.pendingResize){state.pendingResize=false;resizeCanvas();}
 if($('submit').disabled) $('reset').focus();else $('submit').focus();
}
async function submitScore(event){
 if(event) event.preventDefault();
 if(state.submitting||state.submitted||!state.result?.valid) return;
 const nickname=cleanNickname($('nickname').value);
 if(!nickname||nicknameLength(nickname)>24){$('nicknameError').textContent=nickname?t('nicknameLong'):t('nicknameEmpty');$('nickname').focus();return;}
 const result=state.result;
 const payload={
  eventId:'mid-autumn-2026',nickname:escapeHTML(nickname),score:result.score,
  durationMs:result.durationMs,createdAt:result.createdAt,
  canvasWidth:result.width,canvasHeight:result.height,
  // 保留经过距离过滤的原始轨迹，服务器应恢复 x*width、y*height 再评分。
  // 不可直接在非正方形画布的 [0,1]×[0,1] 坐标上拟合圆，否则会变椭圆。
  normalizedPoints:state.points.map(p=>({x:clamp(p.x/result.width),y:clamp(p.y/result.height),t:Math.round(p.t)})),
  metrics:{...result.metrics},algorithmVersion:SCORE_CONFIG.version,
  submissionId:globalThis.crypto?.randomUUID?.()||`moon-${Date.now()}-${Math.random().toString(36).slice(2)}`
 };
 state.submitting=true;$('confirmSubmit').disabled=true;$('closeModal').disabled=true;$('submit').disabled=true;$('confirmSubmit').textContent=t('preparing');
 try{
  console.log('成绩已准备提交（演示，未发送）',payload);
  // ===== 未来后端接口位置：替换演示等待，并由服务器重新计算成绩 =====
  // const response = await fetch('/api/scores', {
  //   method:'POST', headers:{'Content-Type':'application/json'},
  //   body:JSON.stringify(payload)
  // });
  // if(!response.ok) throw new Error('提交失败，请稍后重试');
  // const saved = await response.json(); // UI 应显示服务器确认的分数
  // 昵称字段目前为 HTML 转义文本；后端应明确编码约定，避免二次转义。
  // 排行榜仍必须使用 textContent 渲染解码后的纯文本，不拼接 innerHTML。
  await new Promise(resolve=>setTimeout(resolve,250));
  state.submitted=true;state.uiState='submitted';$('verdict').textContent=t('submitted');
  $('poem').textContent=t('demo');
  $('submit').textContent=t('submittedButton');
 }catch(error){$('nicknameError').textContent=error.message||t('submitFailed');}
 finally{
  state.submitting=false;$('confirmSubmit').disabled=false;$('closeModal').disabled=false;$('confirmSubmit').textContent=t('prepare');
  $('submit').disabled=state.submitted||!state.result?.valid;
  if(state.submitted) closeModal();
 }
}
$('reset').addEventListener('click',()=>resetGame());
$('submit').addEventListener('click',openModal);
$('closeModal').addEventListener('click',closeModal);
$('nicknameForm').addEventListener('submit',submitScore);
$('nickname').addEventListener('input',()=>{$('nicknameError').textContent=nicknameLength(cleanNickname($('nickname').value))>24?t('nicknameLongShort'):'';});
$('modal').addEventListener('keydown',event=>{
 if(event.key==='Escape'){event.preventDefault();closeModal();}
 if(event.key==='Tab'){
  const list=Array.from($('nicknameForm').querySelectorAll('input,button')).filter(el=>!el.disabled);
  const first=list[0],last=list[list.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
 }
});
$('languageSelect').addEventListener('change',event=>setLanguage(event.target.value));
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>cancelDrawing('rotate'));
if(window.ResizeObserver) new ResizeObserver(resizeCanvas).observe($('stage'));
bindInputEvents();applyLanguage();resizeCanvas();

// ---------- 无框架算法自检：控制台运行 runSelfTests()，或 URL 加 ?debug=1 ----------
function runSelfTests(){
 let seed=2026;
 const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;};
 const curve=(turns=1,rx=120,ry=120,jitter=0,spiral=0)=>Array.from({length:721},(_,i)=>{
  const a=TAU*turns*i/720,noise=jitter*(.65*Math.sin(a*17)+.35*Math.sin(a*31)),r=1+spiral*i/720+noise;
  return {x:240+rx*r*Math.cos(a),y:320+ry*r*Math.sin(a),t:i*5};
 });
 const cases={
  '完美圆':curve(),'轻微抖动的圆':curve(1,120,120,.022),
  '椭圆':curve(1,150,85),'半圆':curve(.5),'开口圆':curve(.80),
  '两圈螺旋':curve(2,80,80,0,.65),
  '直线':Array.from({length:120},(_,i)=>({x:80+i*2,y:100+i*3,t:i*10})),
  '随机乱画':Array.from({length:180},(_,i)=>({x:80+random()*300,y:150+random()*350,t:i*10}))
 };
 const results=Object.entries(cases).map(([name,points])=>({name,...analyzeTrajectory(points,480,640)}));
 console.table(results.map(r=>({轨迹:r.name,有效:r.valid,得分:r.valid?r.score:'不计分',提示:r.reasonKey?t(r.reasonKey):''})));
 console.assert(results[0].valid&&results[0].score>=99,'完美圆应接近满分');
 console.assert(results[1].valid&&results[1].score>90&&results[1].score<results[0].score,'轻微抖动应高分且低于完美圆');
 console.assert(results[2].valid&&results[2].score<70,'明显椭圆应中低分');
 console.assert(!results[3].valid,'半圆应无效');
 console.assert(!results[4].valid||results[4].score<40,'开口圆应低分或无效');
 console.assert(results.slice(5).every(r=>!r.valid||r.score<30),'多圈、直线和乱画应无效或低分');
 return results;
}
if(SCORE_CONFIG.debug) runSelfTests();
</script>
