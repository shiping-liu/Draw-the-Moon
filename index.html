:root{--gold:#f6cf79;--pale:#ffebba;--ink:#071327}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{min-height:100vh;min-height:100dvh;overflow:hidden;color:#fff8e8;background:#071327;font-family:"Noto Serif SC","Songti SC",serif}button{font:600 15px "Noto Serif SC","Songti SC",serif}#sky{position:fixed;inset:0;width:100%;height:100%}.moon-haze{position:fixed;z-index:0;top:-18vw;left:50%;width:min(92vw,630px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,239,185,.22),rgba(255,232,165,.07) 28%,rgba(198,218,255,.025) 47%,transparent 69%);filter:blur(4px);pointer-events:none}.cloud{position:fixed;z-index:1;width:250px;height:42px;opacity:0;pointer-events:none;filter:blur(1px);background:radial-gradient(ellipse at 25% 68%,rgba(188,207,230,.16) 0 21%,transparent 22%),radial-gradient(ellipse at 48% 43%,rgba(188,207,230,.15) 0 28%,transparent 29%),radial-gradient(ellipse at 73% 72%,rgba(188,207,230,.12) 0 27%,transparent 28%);animation:cloud-drift 18s linear infinite}.cloud.one{top:25%;left:-280px;animation-delay:-3s}.cloud.two{top:53%;left:-310px;transform:scale(.76);animation-duration:23s;animation-delay:-15s}@keyframes cloud-drift{0%{opacity:0;translate:0 0}12%,79%{opacity:1}100%{opacity:0;translate:calc(100vw + 590px) 14px}}.world{position:fixed;z-index:1;inset:auto 0 0;height:28vh;pointer-events:none;overflow:hidden}.water{position:absolute;inset:63% 0 0;background:linear-gradient(#0a2342,#050f22);opacity:.7}.water::after{content:"";position:absolute;inset:18px -10% 0;background:repeating-linear-gradient(178deg,transparent 0 13px,rgba(171,202,223,.08) 14px 15px,transparent 16px 27px);transform:perspective(170px) rotateX(59deg);transform-origin:top}.mountain{position:absolute;bottom:28%;width:0;height:0;border-left:22vw solid transparent;border-right:22vw solid transparent;border-bottom:18vh solid #071a33;opacity:.93}.mountain.a{left:-13vw;border-bottom-color:#0b2846}.mountai main{z-index:3;position:relative;min-height:100dvh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 19px max(17px,env(safe-area-inset-bottom))}header{text-align:center;animation:arrive .8s ease both}.eyebrow{color:#e8d7ab;font-size:11px;letter-spacing:.33em;text-indent:.33em;opacity:.76}h1{margin-top:4px;font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;font-size:clamp(29px,8vw,42px);font-weight:400;letter-spacing:.16em;text-indent:.16em;color:var(--pale);text-shadow:0 0 22px rgba(252,218,143,.48)}header p{margin-top:2px;color:#d2d9e6;font-size:13px;letter-spacing:.12em}.mirror-wrap{position:relative;width:min(82vw,49dvh,365px);aspect-ratio:1;display:grid;place-items:center;animation:arrive .9s .08s ease both}.fan-handle{position:absolute;z-index:-1;width:33px;height:92px;bottom:-70px;left:calc(50% - 16px);border-radius:0 0 50% 50%;background:linear-gradient(90deg,#8d5e25,#e7be64 45%,#865823);box-shadow:0 8px 17px rgba(0,0,0,.3)}.fan-handle::after{content:"";position:absolute;width:45px;height:7px;top:-1px;left:-6px;border-radius:100%;background:#e2bc68}.mirror{position:relative;width:100%;height:100%;padding:9px;overflow:hidden;border:1px solid rgba(255,226,158,.68);border-radius:50%;background:linear-gradient(140deg,rgba(224,241,255,.2),rgba(44,85,127,.14) 53%,rgba(255,207,110,.1));box-shadow:inset 0 0 0 7px rgba(255,241,197,.06),inset 0 0 35px rgba(255,233,169,.12),0 0 0 8px rgba(255,219,134,.028),0 0 50px rgba(255,219,134,.16);backdrop-filter:blur(6px)}.mirror::before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(255,231,172,.2);pointer-events:none}.mirror::after{content:"月宫镜";position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(255,234,175,.42);letter-spacing:.32em;text-indent:.32em;font-size:10px;pointer-events:none}#drawCanvas{display:block;width:100%;height:100%;border-radius:50%;touch-action:none;cursor:crosshair}.brush-tip{position:absolute;z-index:4;width:13px;height:13px;display:none;border:2px solid rgba(255,235,172,.76);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px #ffd56b;pointer-events:none}.stage-note{position:absolute;bottom:-36px;width:100%;text-align:center;color:#d0d9e9;font-size:12px;letter-spacing:.06em;transition:opacity .25s}.rabbit{position:absolute;z-index:3;right:16%;bottom:19%;display:none;color:#fff3cf;font-size:41px;filter:drop-shadow(0 0 8px #ffe298);animation:rabbit .8s cubic-bezier(.2,.9,.3,1.2) both}.rabbit.show{display:block}@keyframes rabbit{from{transform:translateY(35px) scale(.4);opacity:0}to{transform:none;opacity:1}}.goddess{position:absolute;z-index:3;top:18%;left:-16%;display:none;color:rgba(255,235,192,.85);font-size:48px;filter:drop-shadow(0 0 13px #ffe3a2);animation:goddess 4.4s ease-in-out both}.goddess.show{display:block}@keyframes goddess{from{transform:translateX(-35px);opacity:0}25%,74%{opacity:1}to{transform:translateX(240px) translateY(-15px);opacity:0}}
.score-panel{min-height:112px;width:min(100%,460px);display:grid;place-items:center;align-content:center;text-align:center;padding:8px 12px;background:linear-gradient(90deg,transparent,rgba(11,31,61,.36),transparent);animation:arrive 1s .15s ease both}.score{color:var(--gold);font-size:clamp(39px,11vw,55px);font-weight:700;line-height:1;text-shadow:0 0 18px rgba(255,202,75,.62);font-variant-numeric:tabular-nums}.score small{font-size:.44em;margin-left:4px;font-weight:500}.name{min-height:24px;margin-top:5px;color:#fff0c1;font-size:17px;font-weight:600;letter-spacing:.12em}.message{min-height:20px;max-width:330px;color:#d8e0ee;font-size:12px;line-height:1.55}.roundness{min-height:19px;margin-top:5px;color:#efd493;font-size:11px;letter-spacing:.05em}.actions{width:min(100%,380px);display:flex;gap:10px;animation:arrive 1.08s .2s ease both}.btn{height:48px;border-radius:999px;border:1px solid rgba(255,236,180,.2);color:#fff7e8;background:rgba(17,42,76,.56);transition:transform .15s,filter .15s,opacity .15s}.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.1)}.btn.primary{flex:1.35;border:0;color:#4b2d04;background:linear-gradient(135deg,#ffe8ad,#efb440);box-shadow:0 8px 26px rgba(238,176,54,.24)}.btn.secondary{flex:1}.btn:disabled{opacity:.45;cursor:not-allowed}#blossoms{position:fixed;z-index:8;inset:0;pointer-events:none;overflow:hidden}.petal{position:absolute;color:#f5be53;font-size:16px;text-shadow:0 0 7px #f6ce74;animation:petal-fall var(--d) linear both}@keyframes petal-fall{from{translate:0 -30px;rotate:0deg;opacity:0}12%{opacity:1}to{translate:var(--x) 110vh;rotate:520deg;opacity:0}}.modal{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(1,9,23,.75);backdrop-filter:blur(10px)}.modal.show{display:flex}.modal-box{width:min(100%,367px);animation:pop .35s ease both}#shareCard{display:block;width:100%;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.52)}.modal-actions{display:flex;gap:10px;margin-top:12px}.modal-actions .btn{flex:1}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}@media(max-height:670px){main{padding-top:9px;padding-bottom:11px}.mirror-wrap{width:min(67vw,43dvh,290px)}.score-panel{min-height:86px}.fan-handle{height:69px;bottom:-53px}.stage-note{bottom:-29px}.eyebrow{display:none}h1{font-size:28px}.score{font-size:39px}}

<canvas id="sky"></canvas><div class="moon-haze"></div><div class="cloud one"></div><div class="cloud two"></div><div class="world"><div class="mountain a"></div><div class="mountain b"></div><div class="mountain c"></div><div class="water"></div><div class="lantern"></div><div class="osmanthus"></div></div><div id="blossoms"></div>
<main><header><div class="eyebrow">MID-AUTUMN NIGHT WALK</div><h1>中秋画月挑战</h1><p>一笔一月 · 团圆常在</p></header><section class="mirror-wrap"><div class="fan-handle"></div><div class="mirror"><canvas id="drawCanvas" aria-label="在这里一笔画月"></canvas><span class="brush-tip" id="tip"></span><span class="rabbit" id="rabbit">🐇</span><span class="goddess" id="goddess">♧</span></div><div class="stage-note" id="note">在月宫镜中，一笔画出满月</div></section><section class="score-panel" aria-live="polite"><div class="score" id="score">--</div><div class="name" id="name">今夜，请为思念的人画一轮月</div><div class="message" id="message">圆润度将由最佳拟合圆计算</div><div class="roundness" id="roundness"></div></section><div class="actions"><button class="btn secondary" id="reset">再邀明月</button><button class="btn primary" id="light" disabled>点亮我的月亮</button></div></main>
<div class="modal" id="modal"><div class="modal-box"><canvas id="shareCard" width="1080" height="1350"></canvas><div class="modal-actions"><button class="btn secondary" id="close">返回</button><button class="btn primary" id="save">保存月亮卡</button></div></div></div>
<script>
const cvs=document.querySelector('#drawCanvas'),ctx=cvs.getContext('2d'),sky=document.querySelector('#sky'),sctx=sky.getContext('2d'),tip=document.querySelector('#tip'),note=document.querySelector('#note'),scoreEl=document.querySelector('#score'),nameEl=document.querySelector('#name'),messageEl=document.querySelector('#message'),roundnessEl=document.querySelector('#roundness'),light=document.querySelector('#light'),rabbit=document.querySelector('#rabbit'),goddess=document.querySelector('#goddess');let dpr=1,drawing=false,points=[],outcome=null,reveal=0,frame=null;
function resize(){const r=cvs.getBoundingClientRect();dpr=Math.min(3,devicePixelRatio||1);cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paint(reveal)}function getPoint(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function brushPath(alpha=1){if(points.length<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#ffe6a0';ctx.shadowColor='#ffca5b';ctx.shadowBlur=11;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5.2;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++){const p=points[i],q=points[i-1];ctx.quadraticCurveTo(q.x,q.y,(q.x+p.x)/2,(q.y+p.y)/2)}ctx.stroke();ctx.restore()}
function paint(t=0){const r=cvs.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!outcome){brushPath();return}const{fit}=outcome,eased=1-Math.pow(1-t,3);ctx.save();ctx.beginPath();ctx.arc(fit.cx,fit.cy,fit.r,0,Math.PI*2);ctx.clip();const grad=ctx.createRadialGradient(fit.cx-fit.r*.3,fit.cy-fit.r*.35,fit.r*.08,fit.cx,fit.cy,fit.r*1.05);grad.addColorStop(0,`rgba(255,251,221,${.92*eased})`);grad.addColorStop(.66,`rgba(255,224,146,${.77*eased})`);grad.addColorStop(1,`rgba(219,172,80,${.78*eased})`);ctx.fillStyle=grad;ctx.fillRect(fit.cx-fit.r,fit.cy-fit.r,fit.r*2,fit.r*2);ctx.fillStyle=`rgba(139,97,48,${.14*eased})`;for(let i=0;i<9;i++){const a=i*2.37;ctx.beginPath();ctx.arc(fit.cx+Math.cos(a)*fit.r*(.22+(i%3)*.15),fit.cy+Math.sin(a)*fit.r*(.16+(i%4)*.11),fit.r*(.045+(i%3)*.032),0,Math.PI*2);ctx.fill()}ctx.restore();brushPath(1-eased*.76);ctx.save();ctx.globalAlpha=eased;ctx.shadowColor='#ffcf65';ctx.shadowBlur=18;ctx.strokeStyle='#fff0b7';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(fit.cx,fit.cy,fit.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function start(e){e.preventDefault();clear(false);drawing=true;cvs.setPointerCapture?.(e.pointerId);points=[getPoint(e)];note.style.opacity=0;tip.style.display='block';moveTip(points[0]);paint()}function moveTip(p){tip.style.left=p.x+'px';tip.style.top=p.y+'px'}function move(e){if(!drawing)return;const p=getPoint(e),last=points.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)<1.1)return;points.push(p);moveTip(p);paint()}function end(e){if(!drawing)return;drawing=false;tip.style.display='none';cvs.releasePointerCapture?.(e.pointerId);grade()}cvs.addEventListener('pointerdown',start);cvs.addEventListener('pointermove',move);cvs.addEventListener('pointerup',end);cvs.addEventListener('pointercancel',end);
function resample(ps,step=3){const result=[ps[0]];let last=ps[0],carry=0;for(let i=1;i<ps.length;i++){const target=ps[i];let dx=target.x-last.x,dy=target.y-last.y,len=Math.hypot(dx,dy);if(!len)continue;while(carry+len>=step){const need=step-carry,t=need/len;last={x:last.x+dx*t,y:last.y+dy*t};result.push(last);dx=target.x-last.x;dy=target.y-last.y;len=Math.hypot(dx,dy);carry=0}carry+=len;last=target}return result}function circleFit(ps){let sx=0,sy=0,sxx=0,syy=0,sxy=0,sxz=0,syz=0;for(const p of ps){const z=p.x*p.x+p.y*p.y;sx+=p.x;sy+=p.y;sxx+=p.x*p.x;syy+=p.y*p.y;sxy+=p.x*p.y;sxz+=p.x*z;syz+=p.y*z}const A=[[sxx,sxy,sx],[sxy,syy,sy],[sx,sy,ps.length]],b=[-sxz,-syz,-(sxx+syy)];for(let i=0;i<3;i++){let m=i;for(let j=i+1;j<3;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];if(Math.abs(A[i][i])<1e-8)return null;for(let j=i+1;j<3;j++){const f=A[j][i]/A[i][i];for(let k=i;k<3;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}const v=[0,0,0];for(let i=2;i>=0;i--)v[i]=(b[i]-A[i].slice(i+1).reduce((s,a,k)=>s+a*v[i+k+1],0))/A[i][i];const cx=-v[0]/2,cy=-v[1]/2;return{cx,cy,r:Math.sqrt(Math.max(0,cx*cx+cy*cy-v[2]))}}function phase(s){if(s<60)return['云遮残月','月有阴晴圆缺，这一笔也有自己的故事。'];if(s<85)return['桂影盈月','很接近十五的月亮了，桂花正为你落下。'];if(s<95)return['人间满月','好圆的一轮月，今夜宜团圆。'];return['月宫画师','天上月圆，人间圆满。你画出了今晚的满月。']}
function grade(){if(points.length<22){invalid('这一笔太短啦，请画一轮完整的月亮。');return}const ps=resample(points),fit=circleFit(ps),w=cvs.getBoundingClientRect().width;if(!fit||fit.r<w*.18){invalid('月亮画得太小啦，请画得更饱满一些。');return}const avg=ps.reduce((s,p)=>s+Math.hypot(p.x-fit.cx,p.y-fit.cy),0)/ps.length,dev=ps.reduce((s,p)=>s+Math.abs(Math.hypot(p.x-fit.cx,p.y-fit.cy)-avg),0)/ps.length/avg,score=Math.round(Math.max(0,Math.min(100,100-dev*265))*10)/10;outcome={fit,score,dev};const[n,m]=phase(score);scoreEl.innerHTML=score+'<small>分</small>';nameEl.textContent=n;messageEl.textContent=m;roundnessEl.textContent='圆润度唯一评分 · 平均偏差 '+(dev*100).toFixed(1)+'%';light.disabled=false;reveal=0;cancelAnimationFrame(frame);const begin=performance.now();function animate(now){reveal=Math.min(1,(now-begin)/950);paint(reveal);if(reveal<1)frame=requestAnimationFrame(animate);else celebrate(score)}frame=requestAnimationFrame(animate)}
function invalid(t){outcome=null;scoreEl.textContent='--';nameEl.textContent='今夜，请为思念的人画一轮月';messageEl.textContent=t;roundnessEl.textContent='';light.disabled=true;paint()}function celebrate(s){fallPetals(s>94?36:15);if(s>=85){rabbit.classList.remove('show');void rabbit.offsetWidth;rabbit.classList.add('show')}if(s>=96){goddess.classList.remove('show');void goddess.offsetWidth;goddess.classList.add('show')}}function fallPetals(n){const box=document.querySelector('#blossoms');for(let i=0;i<n;i++){const e=document.createElement('span');e.className='petal';e.textContent='✦';e.style.left=(55+Math.random()*45)+'vw';e.style.setProperty('--x',(-190+Math.random()*160)+'px');e.style.setProperty('--d',(2.4+Math.random()*2.7)+'s');e.style.animationDelay=(Math.random()*.6)+'s';box.append(e);setTimeout(()=>e.remove(),6000)}}function clear(message=true){drawing=false;points=[];outcome=null;reveal=0;cancelAnimationFrame(frame);rabbit.classList.remove('show');goddess.classList.remove('show');scoreEl.textContent='--';nameEl.textContent='今夜，请为思念的人画一轮月';messageEl.textContent=message?'圆润度将由最佳拟合圆计算':'尽量一笔完成，画得饱满一些';roundnessEl.textContent='';note.style.opacity=1;light.disabled=true;paint()}document.querySelector('#reset').onclick=()=>clear(false);
function skyPaint(){const w=innerWidth,h=innerHeight,ratio=Math.min(2,devicePixelRatio||1);sky.width=w*ratio;sky.height=h*ratio;sctx.setTransform(ratio,0,0,ratio,0,0);const bg=sctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#102c58');bg.addColorStop(.52,'#0a1c3a');bg.addColorStop(1,'#061124');sctx.fillStyle=bg;sctx.fillRect(0,0,w,h);for(let i=0;i<105;i++){const x=Math.random()*w,y=Math.random()*h*.7,r=Math.random()*1.1+.2;sctx.fillStyle=`rgba(255,244,204,${.15+Math.random()*.65})`;sctx.beginPath();sctx.arc(x,y,r,0,7);sctx.fill()}}
function card(){const c=document.querySelector('#shareCard'),x=c.getContext('2d'),w=c.width,h=c.height,g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a477f');g.addColorStop(.65,'#0a1c3a');g.addColorStop(1,'#061124');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<130;i++){x.fillStyle='rgba(255,245,208,.7)';x.beginPath();x.arc(Math.random()*w,Math.random()*h*.73,Math.random()*1.7+.4,0,7);x.fill()}const{fit,score}=outcome,sc=2.95,cx=w/2,cy=570,r=fit.r*sc;x.shadowColor='#ffcb60';x.shadowBlur=65;x.fillStyle='#ffe3a0';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.shadowBlur=0;x.save();x.translate(cx-fit.cx*sc,cy-fit.cy*sc);x.scale(sc,sc);x.strokeStyle='#a8772e';x.lineWidth=4.4;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.stroke();x.restore();const[n]=phase(score);x.textAlign='center';x.fillStyle='#fff0bd';x.font='48px serif';x.fillText('中秋画月挑战',cx,120);x.fillStyle='#ffdf8d';x.font='700 82px serif';x.fillText(score+' 分',cx,1060);x.fillStyle='#fff0bd';x.font='600 42px serif';x.fillText(n,cx,1135);x.fillStyle='#d5dfed';x.font='31px serif';x.fillText('我把这轮月亮，送给想念的人。',cx,1212);x.fillStyle='rgba(255,226,154,.72)';x.font='25px serif';x.fillText('一笔一月 · 团圆常在',cx,1282)}
const modal=document.querySelector('#modal');light.onclick=()=>{if(!outcome)return;card();modal.classList.add('show')};document.querySelector('#close').onclick=()=>modal.classList.remove('show');document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='我的中秋月亮卡.png';a.href=document.querySelector('#shareCard').toDataURL('image/png');a.click()};window.addEventListener('resize',()=>{skyPaint();resize()});skyPaint();resize();

// 结果月亮直接悬浮于星空：按得分选择月面表情，并精确跟随拟合圆的大小和位置。
const moonEmoji=document.createElement('span');
moonEmoji.className='moon-emoji';
document.querySelector('.mirror').append(moonEmoji);
note.textContent='在星空中，一笔画出满月';
const scoreMoon=grade, resetMoon=clear;
grade=function(){
  scoreMoon();
  if(!outcome) return;
  const {fit,score}=outcome;
  moonEmoji.textContent=score>=80?'🌕':'🌝';
  moonEmoji.style.left=fit.cx+'px';
  moonEmoji.style.top=fit.cy+'px';
  moonEmoji.style.fontSize=(fit.r*2.1)+'px';
  moonEmoji.classList.remove('show');
  setTimeout(()=>{ if(outcome && outcome.fit===fit) moonEmoji.classList.add('show'); },850);
};
clear=function(...args){
  moonEmoji.classList.remove('show');
  moonEmoji.textContent='';
  return resetMoon(...args);
};
</script></body></html>
