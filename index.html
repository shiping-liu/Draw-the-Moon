<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>中秋画月挑战</title>
  <style>
    :root { --gold:#ffd56b; --ink:#071126; --paper:#fff5d7; --muted:#c9d0df; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { min-height:100vh; min-height:100dvh; overflow:hidden; color:#fff8df; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:radial-gradient(circle at 50% 14%, #1b3563 0, #0d1d3d 31%, #050a18 76%); }
    #sky, #effects { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
    #sky { opacity:.93; } #effects { z-index:4; overflow:hidden; }
    main { position:relative; z-index:2; height:100dvh; min-height:560px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:max(14px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
    header { text-align:center; animation:rise .7s ease both; }
    h1 { font-size:clamp(1.35rem, 6vw, 2rem); letter-spacing:.17em; text-indent:.17em; text-shadow:0 0 22px rgba(255,214,107,.55); }
    header p { color:#d4d9e6; margin-top:6px; font-size:clamp(.78rem, 3.5vw, .95rem); }
    .moon-stage { width:min(82vw, 48dvh, 350px); aspect-ratio:1; position:relative; display:grid; place-items:center; animation:rise .85s .08s ease both; }
    .moon-halo { position:absolute; inset:-15%; border-radius:50%; background:radial-gradient(circle, rgba(255,221,135,.16), rgba(255,221,135,.04) 43%, transparent 69%); filter:blur(3px); transition:opacity .5s; }
    .moon-frame { position:relative; width:100%; height:100%; padding:8px; border:1px solid rgba(255,225,154,.38); border-radius:50%; box-shadow:inset 0 0 34px rgba(253,218,129,.08), 0 0 32px rgba(255,211,91,.08); background:radial-gradient(circle at 37% 30%, rgba(255,255,255,.12), rgba(255,255,255,.025) 45%, rgba(0,0,0,.09)); }
    .moon-frame::before,.moon-frame::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,222,145,.15); inset:18px; pointer-events:none; }
    .moon-frame::after { inset:34px; border-style:dashed; border-color:rgba(255,222,145,.19); }
    canvas { width:100%; height:100%; display:block; border-radius:50%; touch-action:none; cursor:crosshair; }
    .hint { position:absolute; bottom:-30px; width:100%; color:#c9d0df; text-align:center; font-size:.78rem; opacity:.82; transition:opacity .3s; }
    .result { min-height:116px; text-align:center; display:grid; place-items:center; align-content:center; gap:4px; max-width:480px; animation:rise .95s .15s ease both; }
    .score { font-size:clamp(2.25rem, 10vw, 3.25rem); font-weight:800; color:var(--gold); line-height:1; text-shadow:0 0 18px rgba(255,205,78,.7); font-variant-numeric:tabular-nums; }
    .title { font-weight:700; font-size:clamp(1rem,4vw,1.18rem); color:#fff0bd; min-height:1.35em; }
    .message { color:#dce0eb; font-size:clamp(.78rem,3.25vw,.92rem); min-height:1.35em; }
    .metrics { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; min-height:22px; }
    .metrics span { color:#ffe6a0; font-size:.68rem; padding:3px 7px; border:1px solid rgba(255,221,137,.28); background:rgba(255,255,255,.05); border-radius:99px; }
    .actions { display:flex; width:min(100%, 370px); gap:10px; animation:rise 1s .2s ease both; }
    button { border:0; border-radius:999px; min-height:46px; padding:0 16px; font:700 .96rem inherit; cursor:pointer; transition:transform .16s, filter .16s, opacity .16s; }
    button:active { transform:scale(.96); } button:hover { filter:brightness(1.08); }
    .secondary { flex:1; color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); }
    .primary { flex:1.35; color:#3f2b05; background:linear-gradient(135deg,#ffe6a2,#f7b928); box-shadow:0 8px 20px rgba(238,173,31,.2); }
    .primary:disabled { opacity:.45; cursor:not-allowed; }
    .mountains { position:fixed; z-index:1; left:0; right:0; bottom:0; height:23vh; opacity:.5; background:linear-gradient(145deg, transparent 50%, #071629 50%) 0 100%/35% 100% no-repeat, linear-gradient(35deg, transparent 50%, #0a1a2f 50%) 45% 100%/43% 100% no-repeat, linear-gradient(155deg, transparent 50%, #061322 50%) 79% 100%/37% 100% no-repeat; }
    .card-modal { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(1,6,17,.7); backdrop-filter:blur(7px); }
    .card-modal.show { display:flex; } .modal-box { width:min(100%, 370px); animation:pop .35s ease both; }
    #shareCard { width:100%; aspect-ratio:4/5; display:block; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .modal-actions { margin-top:13px; display:flex; gap:10px; } .modal-actions button { flex:1; }
    @keyframes rise { from {opacity:0; transform:translateY(12px)} to {opacity:1; transform:none} } @keyframes pop { from {opacity:0; transform:scale(.92)} to {opacity:1; transform:scale(1)} }
    @media (max-height:650px) { main{min-height:0;padding-top:9px;padding-bottom:10px}.moon-stage{width:min(66vw,42dvh,290px)}.result{min-height:88px}.hint{bottom:-24px} }
  </style>
</head>
<body>
  <canvas id="sky"></canvas><div id="effects"></div><div class="mountains"></div>
  <main>
    <header><h1>中秋画月挑战</h1><p>一笔画出心中的圆月</p></header>
    <section class="moon-stage" aria-label="画月画布"><div class="moon-halo"></div><div class="moon-frame"><canvas id="drawCanvas"></canvas></div><p class="hint" id="hint">在月宫镜中一笔画出满月</p></section>
    <section class="result" aria-live="polite"><div id="score" class="score">--</div><div id="title" class="title">今夜，请为思念的人画一轮月</div><div id="message" class="message">尽量画得饱满、闭合、圆润</div><div id="metrics" class="metrics"></div></section>
    <div class="actions"><button class="secondary" id="resetBtn">再邀明月</button><button class="primary" id="cardBtn" disabled>点亮我的月亮</button></div>
  </main>
  <div class="card-modal" id="modal"><div class="modal-box"><canvas id="shareCard" width="1080" height="1350"></canvas><div class="modal-actions"><button class="secondary" id="closeBtn">返回</button><button class="primary" id="saveBtn">保存月亮卡</button></div></div></div>
  <script>
    const canvas=document.querySelector('#drawCanvas'), ctx=canvas.getContext('2d');
    const sky=document.querySelector('#sky'), sctx=sky.getContext('2d');
    const scoreEl=document.querySelector('#score'), titleEl=document.querySelector('#title'), messageEl=document.querySelector('#message'), metricsEl=document.querySelector('#metrics'), hint=document.querySelector('#hint'), cardBtn=document.querySelector('#cardBtn');
    let drawing=false, points=[], result=null, dpr=1;
    const palette={gold:'#ffe3a0', line:'#ffe59a'};

    function resizeCanvas(){ const r=canvas.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,3); canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); drawExisting(); }
    function drawExisting(){ const r=canvas.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); if(points.length<2)return; ctx.save(); ctx.strokeStyle=palette.line; ctx.shadowColor='#ffc84a'; ctx.shadowBlur=8; ctx.lineWidth=4.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y); points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke(); if(result) drawMoonGuide(); ctx.restore(); }
    function point(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
    function start(e){ e.preventDefault(); reset(); drawing=true; canvas.setPointerCapture?.(e.pointerId); points=[point(e)]; hint.style.opacity=0; drawExisting(); }
    function move(e){ if(!drawing)return; const p=point(e), prev=points.at(-1); if(Math.hypot(p.x-prev.x,p.y-prev.y)<1.25)return; points.push(p); drawExisting(); }
    function end(e){ if(!drawing)return; drawing=false; canvas.releasePointerCapture?.(e.pointerId); scoreDrawing(); }
    canvas.addEventListener('pointerdown',start); canvas.addEventListener('pointermove',move); canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);

    // 均匀重采样：消除画得慢的区段采样更多而影响评分的问题。
    function resample(path, spacing=3){ let output=[path[0]], carry=0; for(let i=1;i<path.length;i++){ let a=path[i-1], b=path[i], dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); if(!len)continue; let dist=spacing-carry; while(dist<=len){ const t=dist/len, p={x:a.x+dx*t,y:a.y+dy*t}; output.push(p); a=p; dx=b.x-a.x;dy=b.y-a.y;len=Math.hypot(dx,dy);dist=spacing;carry=0; } carry+=len; } return output; }
    // Kåsa least-squares circle fit: 比直接取形心更公平。
    function fitCircle(ps){ let sx=0,sy=0,sxx=0,syy=0,sxy=0,sxz=0,syz=0; for(const p of ps){const z=p.x*p.x+p.y*p.y;sx+=p.x;sy+=p.y;sxx+=p.x*p.x;syy+=p.y*p.y;sxy+=p.x*p.y;sxz+=p.x*z;syz+=p.y*z;} const n=ps.length, A=[[sxx,sxy,sx],[sxy,syy,sy],[sx,sy,n]], b=[-sxz,-syz,-(sxx+syy)]; for(let i=0;i<3;i++){let m=i;for(let j=i+1;j<3;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];if(Math.abs(A[i][i])<1e-8)return null;for(let j=i+1;j<3;j++){const f=A[j][i]/A[i][i];for(let k=i;k<3;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i];}} const x=[0,0,0];for(let i=2;i>=0;i--){x[i]=(b[i]-A[i].slice(i+1).reduce((v,a,k)=>v+a*x[k+i+1],0))/A[i][i];} const cx=-x[0]/2,cy=-x[1]/2,r=Math.sqrt(Math.max(0,cx*cx+cy*cy-x[2]));return {cx,cy,r}; }
    function scoreDrawing(){ if(points.length<20){ showInvalid('这一笔太短啦，请画一轮完整的月亮'); return; } const ps=resample(points), fit=fitCircle(ps); const bounds=canvas.getBoundingClientRect(); if(!fit||fit.r<bounds.width*.12){showInvalid('月亮画得太小啦，试试画得更饱满');return;} const rs=ps.map(p=>Math.hypot(p.x-fit.cx,p.y-fit.cy)); const mean=rs.reduce((a,b)=>a+b,0)/rs.length; const mad=rs.reduce((a,r)=>a+Math.abs(r-mean),0)/rs.length/mean; const gap=Math.min(1,Math.hypot(points[0].x-points.at(-1).x,points[0].y-points.at(-1).y)/(mean*.75)); let angle=0; for(let i=1;i<ps.length;i++){let a=Math.atan2(ps[i-1].y-fit.cy,ps[i-1].x-fit.cx),b=Math.atan2(ps[i].y-fit.cy,ps[i].x-fit.cx),d=b-a;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;angle+=d;} const coverage=Math.min(1,Math.abs(angle)/(Math.PI*2)); let length=0;for(let i=1;i<ps.length;i++)length+=Math.hypot(ps[i].x-ps[i-1].x,ps[i].y-ps[i-1].y); const circumference=2*Math.PI*mean, overdraw=Math.max(0,Math.min(1,(length/circumference-1)/.7)); const round=Math.max(0,Math.min(100,100-mad*225)), closed=Math.max(0,100-gap*100), full=Math.max(0,Math.min(100,coverage*112)), steady=Math.max(0,100-overdraw*75); const score=Math.round((round*.45+closed*.25+full*.15+steady*.15)*10)/10; result={score,fit,metrics:{round,closed,full,steady},phase:getPhase(score)}; present(result); drawExisting(); createFireflies(score); }
    function getPhase(score){ if(score<60)return {name:'云遮残月',desc:'月有阴晴圆缺，这一笔也有自己的故事。',fill:.35}; if(score<85)return {name:'桂影盈月',desc:'很接近十五的月亮了，桂花正为你落下。',fill:.75}; if(score<95)return {name:'人间满月',desc:'好圆的一轮月，今夜宜团圆。',fill:1}; return {name:'月宫画师',desc:'天上月圆，人间圆满。你画出了今晚的满月。',fill:1.08}; }
    function present(r){ scoreEl.textContent=r.score+' 分'; titleEl.textContent=r.phase.name; messageEl.textContent=r.phase.desc; metricsEl.innerHTML=[['圆润',r.metrics.round],['闭合',r.metrics.closed],['饱满',r.metrics.full],['稳定',r.metrics.steady]].map(([n,v])=>`<span>${n} ${Math.round(v)}</span>`).join(''); cardBtn.disabled=false; }
    function showInvalid(text){ result=null; scoreEl.textContent='--';titleEl.textContent='今夜，请为思念的人画一轮月';messageEl.textContent=text;metricsEl.innerHTML='';cardBtn.disabled=true; }
    function drawMoonGuide(){ const {fit,phase}=result; ctx.save();ctx.beginPath();ctx.arc(fit.cx,fit.cy,fit.r,0,Math.PI*2);ctx.fillStyle='rgba(255,227,160,.10)';ctx.fill();ctx.setLineDash([4,7]);ctx.strokeStyle='rgba(255,231,168,.42)';ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);ctx.restore(); }
    function reset(){ drawing=false;points=[];result=null;ctx.clearRect(0,0,canvas.width,canvas.height);scoreEl.textContent='--';titleEl.textContent='今夜，请为思念的人画一轮月';messageEl.textContent='尽量画得饱满、闭合、圆润';metricsEl.innerHTML='';hint.style.opacity=.82;cardBtn.disabled=true; }
    document.querySelector('#resetBtn').onclick=reset;
    function stars(){ const w=innerWidth,h=innerHeight; sky.width=w*(devicePixelRatio||1);sky.height=h*(devicePixelRatio||1);sctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);sctx.clearRect(0,0,w,h);for(let i=0;i<90;i++){const x=Math.random()*w,y=Math.random()*h*.76,r=Math.random()*1.25+.25;sctx.fillStyle=`rgba(255,245,205,${Math.random()*.65+.15})`;sctx.beginPath();sctx.arc(x,y,r,0,7);sctx.fill();} }
    function createFireflies(score){ if(score<60)return; const box=document.querySelector('#effects'); for(let i=0;i<(score>94?26:14);i++){const e=document.createElement('i');e.style.cssText=`position:absolute;left:${30+Math.random()*40}%;top:${30+Math.random()*36}%;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;border-radius:50%;background:#ffe58f;box-shadow:0 0 10px #ffd166;animation:fly ${1.7+Math.random()*1.8}s ease-out forwards`;box.append(e);setTimeout(()=>e.remove(),3800);} }
    const style=document.createElement('style');style.textContent='@keyframes fly{0%{opacity:0;transform:translate(0,10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),-70px) scale(1)}}';document.head.append(style);
    function card(){ const c=document.querySelector('#shareCard'),x=c.getContext('2d'),w=c.width,h=c.height; const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#183d74');g.addColorStop(.55,'#0b1b3a');g.addColorStop(1,'#050a18');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<120;i++){x.fillStyle='rgba(255,245,203,.7)';x.beginPath();x.arc(Math.random()*w,Math.random()*h*.67,Math.random()*2+1,0,7);x.fill();} const {score,fit,phase}=result;const scale=2.8,cx=w/2,cy=570,r=fit.r*scale; x.save();x.shadowColor='#ffdc75';x.shadowBlur=70;x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle='#ffe8aa';x.fill();x.clip();x.fillStyle='rgba(176,141,89,.16)';for(let i=0;i<13;i++){x.beginPath();x.arc(cx+(Math.random()-.5)*r*1.4,cy+(Math.random()-.5)*r*1.4,Math.random()*r*.22+16,0,7);x.fill();}x.restore();x.save();x.translate(cx-fit.cx*scale,cy-fit.cy*scale);x.scale(scale,scale);x.strokeStyle='#c4933e';x.globalAlpha=.75;x.lineWidth=4.3;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.stroke();x.restore();x.textAlign='center';x.fillStyle='#fff0bd';x.font='700 48px sans-serif';x.fillText('中秋画月挑战',cx,130);x.fillStyle='#ffe19a';x.font='700 78px sans-serif';x.fillText(score+' 分',cx,1060);x.fillStyle='#fff0bd';x.font='600 43px sans-serif';x.fillText(phase.name,cx,1130);x.fillStyle='#dce5f2';x.font='32px sans-serif';x.fillText('我把这轮月亮，送给想念的人。',cx,1210);x.fillStyle='rgba(255,231,168,.7)';x.font='26px sans-serif';x.fillText('中秋 · 一笔一月 · 团圆常在',cx,1280); }
    const modal=document.querySelector('#modal');cardBtn.onclick=()=>{if(!result)return;card();modal.classList.add('show');};document.querySelector('#closeBtn').onclick=()=>modal.classList.remove('show');document.querySelector('#saveBtn').onclick=()=>{const a=document.createElement('a');a.download='我的中秋月亮卡.png';a.href=document.querySelector('#shareCard').toDataURL('image/png');a.click();};
    window.addEventListener('resize',()=>{stars();resizeCanvas()}); stars();resizeCanvas();
  </script>
</body>
</html>
